# ContextHub Phase 2 - NAS Dogfood Environment
# PostgreSQL 16 + pgvector + n8n + Gateway
# Usage: docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contexthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contexthub_migrator
      POSTGRES_PASSWORD: ${PG_MIGRATOR_PASSWORD:-change_me_in_env}
      POSTGRES_DB: contexthub
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub_migrator -d contexthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contexthub-net

  n8n:
    image: n8nio/n8n:latest
    container_name: contexthub-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-chctx_n8n_admin_2026}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-chctx_n8n_2026}
      - N8N_ENCRYPTION_KEY=chctx_n8n_encryption_key_2026_fixed_32chars
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5679:5678"
    networks:
      - contexthub-net
    command: start

  gateway:
    image: contexthub-gateway:phase1
    container_name: contexthub-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://contexthub_app:change_me_in_env@postgres:5432/contexthub
      - LEDGER_PATH=/data/living-ledger.md
      - WEB_DIR=/app/web
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - MODEL_PROVIDER=bailian
    volumes:
      - /volume1/docker/contexthub/data:/data
    ports:
      - "8000:8000"
    networks:
      - contexthub-net

  inbox-watcher:
    image: python:3.12-slim
    container_name: contexthub-inbox
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      - GATEWAY_URL=http://gateway:8000
      - INBOX_TOKEN=${INBOX_TOKEN:-test-token-001}
    volumes:
      - /volume1/docker/contexthub/data:/data
      - /volume1/docker/contexthub/worker/inbox_watcher.py:/app/inbox_watcher.py:ro
    command: ["python3", "/app/inbox_watcher.py", "--daemon"]
    networks:
      - contexthub-net

  feishu-bot:
    image: python:3.12-slim
    container_name: contexthub-feishu-bot
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - GATEWAY_URL=http://gateway:8000
      - GATEWAY_TOKEN=test-token-001
    volumes:
      - /volume1/docker/contexthub/gateway/feishu_bot.py:/app/feishu_bot.py:ro
    command: >
      sh -c "pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple lark-oapi httpx &&
             python3 /app/feishu_bot.py"
    networks:
      - contexthub-net

volumes:
  pgdata:
    driver: local
  n8n_data:
    driver: local

networks:
  contexthub-net:
    driver: bridge
