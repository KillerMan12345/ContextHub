# ContextHub Phase 1 - n8n 工作流引擎
# 与 PostgreSQL 同一 compose 文件，共享网络

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contexthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contexthub_migrator
      POSTGRES_PASSWORD: ${PG_MIGRATOR_PASSWORD:-change_me_in_env}
      POSTGRES_DB: contexthub
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"  # NAS 上 5432/5433 被占用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub_migrator -d contexthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contexthub-net

  n8n:
    image: n8nio/n8n:latest
    container_name: contexthub-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me_in_env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-change_me_in_env}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_32_chars_min_xxxxxxxx}
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Asia/Shanghai
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    ports:
      - "127.0.0.1:5679:5678"  # NAS 上 5678 被占用
    networks:
      - contexthub-net
    command: start

volumes:
  pgdata:
    driver: local
  n8n_data:
    driver: local

networks:
  contexthub-net:
    driver: bridge
